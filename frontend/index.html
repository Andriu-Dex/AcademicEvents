<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Events</title>
    <style>
      /* Botón flotante en esquina inferior derecha */
      .solicitud-cambios-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #8a1538;
        color: white;
        border: none;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 50px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(138, 21, 56, 0.3);
        z-index: 1000;
        white-space: nowrap;
      }

      .solicitud-cambios-btn:hover {
        background-color: #6d1129;
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 6px 16px rgba(138, 21, 56, 0.4);
        color: white;
      }

      .solicitud-cambios-btn:active {
        transform: translateY(-1px) scale(1.02);
        box-shadow: 0 3px 8px rgba(138, 21, 56, 0.3);
      }

      .github-icon {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      @media (max-width: 768px) {
        .solicitud-cambios-btn {
          bottom: 15px;
          right: 15px;
          padding: 10px 14px;
          font-size: 12px;
        }

        .github-icon {
          width: 16px;
          height: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Botón con ícono de GitHub -->
    <a
      href="https://github.com/Andriu-Dex/AcademicEvents/issues/new/choose"
      class="solicitud-cambios-btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg class="github-icon" viewBox="0 0 24 24">
        <path
          d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"
        />
      </svg>
      Solicitud De Cambios
    </a>
  </body>
</html>
